name: APK 빌드

# 수동 실행 + android 폴더가 바뀔 때 자동 실행
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

# 빌드한 APK를 공개 다운로드 링크로 올리기 위해 필요
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: 자바 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 설치
        uses: android-actions/setup-android@v3

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 이름 정리
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/geongik-alarm.apk
          ls -lh out

      - name: APK 내려받기용으로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: geongik-alarm-apk
          path: out/geongik-alarm.apk
          if-no-files-found: error

      # 카카오톡은 apk 파일 전송을 막기 때문에, 누구나 받을 수 있는
      # 고정 다운로드 링크를 만들어 그 링크를 전달하도록 한다.
      - name: 공개 다운로드 링크로 배포
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: 경익배차알림 앱
          body: |
            안드로이드 기사님용 배차 알림 앱입니다.

            아래 `geongik-alarm.apk` 를 눌러 내려받아 설치하세요.
            설치 안내: https://jooho1679-lgtm.github.io/app.html
          files: out/geongik-alarm.apk
          make_latest: true
